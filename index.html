<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFX Store | Peds & Clothing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
        }
        .glass-nav {
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hero-text {
            text-shadow: 0px 0px 20px rgba(255, 69, 0, 0.5);
        }
        .btn-orange {
            background: linear-gradient(90deg, #FF4B2B, #FF416C);
            transition: 0.3s;
        }
        .btn-orange:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 75, 43, 0.4);
        }
    </style>
</head>
<body class="text-white min-h-screen">

    <nav class="glass-nav sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="bg-red-600 p-1 rounded italic font-black text-xs">CFX</div>
            <span class="font-bold tracking-tighter text-lg uppercase">Store</span>
        </div>

        <div class="hidden md:flex gap-8 text-sm font-medium uppercase tracking-widest text-gray-300">
            <a href="#" class="hover:text-white transition">Home</a>
            <a href="#" class="hover:text-white transition">Peds</a>
            <a href="#" class="hover:text-white transition">Featured</a>
            <a href="#" class="hover:text-white transition">Upload</a>
        </div>

        <div class="flex items-center gap-6">
            <div class="relative cursor-pointer">
                <i class="fa-solid fa-cart-shopping text-xl text-gray-300"></i>
                <span class="absolute -top-2 -right-2 bg-red-600 text-[10px] px-1.5 rounded-full">0</span>
            </div>
            <button class="bg-[#5865F2] hover:bg-[#4752C4] px-4 py-2 rounded flex items-center gap-2 text-sm font-bold transition">
                <i class="fa-brands fa-discord text-lg"></i>
                LOGIN WITH DISCORD
            </button>
        </div>
    </nav>

    <main class="flex flex-col items-center justify-center text-center px-4 mt-32">
        <span class="bg-red-500/20 text-red-500 border border-red-500/50 px-4 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mb-6">
            Premium Characters
        </span>

        <h1 class="text-5xl md:text-7xl font-black italic uppercase leading-tight">
            Specialists in <br>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-600 hero-text">
                Peds & Clothing
            </span>
        </h1>

        <p class="mt-6 text-gray-400 max-w-2xl text-lg leading-relaxed">
            The premier marketplace for high-quality character models, realistic EUP packs, and custom accessories. Redefine your roleplay experience today.
        </p>

        <div class="mt-10 flex flex-wrap justify-center gap-4">
            <button id="browseBtn" class="btn-orange px-10 py-4 rounded font-bold flex items-center gap-2 uppercase tracking-wider">
                <i class="fa-solid fa-cart-shopping"></i>
                Browse Catalog
            </button>
            <button id="discordBtn" class="bg-transparent border border-white/20 hover:bg-white/10 px-10 py-4 rounded font-bold flex items-center gap-2 uppercase tracking-wider transition">
                <i class="fa-brands fa-discord text-xl"></i>
                Join Discord
            </button>
        </div>
    </main>

    <script>
        // Logique simple pour les boutons
        document.getElementById('browseBtn').addEventListener('click', () => {
            alert('Redirecting to Catalog...');
        });

        document.getElementById('discordBtn').addEventListener('click', () => {
            window.open('https://discord.com', '_blank');
        });

        // Animation simple au scroll pour la navbar
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('nav');
            if (window.scrollY > 50) {
                nav.style.padding = '10px 24px';
            } else {
                nav.style.padding = '16px 24px';
            }
        });
    </script>
</body>
</html>
